# Auto-fires when the `release` workflow (publish.yml) pushes a vX.Y.Z tag. Creates the signed
# GitHub Release + provenance attestations via the org's reusable workflow. Registry publishing
# lives in publish.yml. Renamed to `github release` so it is distinct from the `release` button.
name: github release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    uses: Vev-software/.github/.github/workflows/release-dotnet-npm.yml@main
    permissions:
      contents: write # create the GitHub Release
      id-token: write # Sigstore provenance
      attestations: write
    with:
      solution: Vev.Fabric.slnx
      dotnet_project: src/Vev.Fabric.Contracts/Vev.Fabric.Contracts.csproj
      ts_dir: sdk/typescript
