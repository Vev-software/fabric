# Publishes the SDK packages to the public registries for a released tag.
# OIDC Trusted Publishing — no stored API keys. One-time registry setup per package:
# see the reusable workflow header in Vev-software/.github.
#
# NOTE: the nuget job is INLINED here (not delegated to the org reusable workflow)
# because NuGet Trusted Publishing rejects org-owned policies when the publish runs
# across a reusable-workflow boundary — the OIDC `job_workflow_ref` then points at
# Vev-software/.github and the org policy lookup fails with HTTP 401
# (see https://github.com/NuGet/login/issues/6). Running NuGet/login directly in this
# repo keeps `job_workflow_ref` = Vev-software/fabric/.github/workflows/publish.yml,
# which matches a per-repo policy (repo=fabric, workflow=publish.yml, env=release).
# Revert to the reusable `release-dotnet-npm.yml` nuget job once #6 is fixed. npm is
# unaffected and stays on the reusable workflow.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to publish (e.g. v0.1.0). Must already exist (cut by release.yml)."
        type: string
        required: true
      publish_nuget:
        description: "Publish Vev.Fabric.Contracts to nuget.org"
        type: boolean
        default: true
      publish_npm:
        description: "Publish @vev-software/fabric-contracts to npm"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Inlined nuget publish (see file header for why). Mirrors the reusable workflow's
  # nuget job; keep the two in sync.
  nuget:
    name: publish · nuget.org
    if: ${{ !github.event.repository.fork && inputs.publish_nuget }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC for NuGet Trusted Publishing — no API key
    steps:
      # Check out the released tag with full history so MinVer derives that version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build + test (public feeds only)
        run: |
          dotnet restore Vev.Fabric.slnx
          dotnet build Vev.Fabric.slnx -c Release --no-restore
          dotnet test Vev.Fabric.slnx -c Release --no-build

      # No --no-build: MinVer stamps the version (from the checked-out tag) during pack.
      - name: Pack
        run: dotnet pack src/Vev.Fabric.Contracts/Vev.Fabric.Contracts.csproj -c Release -o artifacts

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key. Needs a
      # trusted-publishing policy on nuget.org and the repo variable NUGET_USER.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # npm stays on the org reusable workflow — unaffected by NuGet/login#6.
  npm:
    name: publish · npm
    if: ${{ inputs.publish_npm }}
    uses: Vev-software/.github/.github/workflows/publish-dotnet-npm.yml@main
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing
    with:
      tag: ${{ inputs.tag }}
      ts_dir: sdk/typescript
      publish_nuget: false
      publish_npm: ${{ inputs.publish_npm }}
